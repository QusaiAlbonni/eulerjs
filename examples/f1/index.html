<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>eulerjs · Formula car at Monza</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #b8c8d8;
        font-family: system-ui, sans-serif;
        color: #f2f4f7;
      }
      canvas {
        display: block;
      }
      /* the panels share one look: dark glass, thin edges */
      .cluster,
      .g-meter,
      .laps,
      .menu {
        position: absolute;
        background: rgba(12, 15, 20, 0.62);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        backdrop-filter: blur(6px);
        user-select: none;
      }
      .cluster {
        right: 22px;
        bottom: 22px;
        padding: 12px 18px 14px;
      }
      .shift-lights {
        display: flex;
        gap: 5px;
        justify-content: center;
        margin-bottom: 10px;
      }
      .light {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #262a31;
        transition: background 0.04s;
      }
      .light.green.on {
        background: #3ddc6a;
        box-shadow: 0 0 8px #3ddc6a;
      }
      .light.red.on {
        background: #ff3b3b;
        box-shadow: 0 0 8px #ff3b3b;
      }
      .light.blue.on {
        background: #4a95ff;
        box-shadow: 0 0 8px #4a95ff;
      }
      .cluster-middle {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .pedals {
        display: flex;
        gap: 6px;
        height: 64px;
      }
      .pedal-track {
        width: 10px;
        height: 100%;
        border-radius: 5px;
        background: #262a31;
        overflow: hidden;
        display: flex;
        align-items: flex-end;
      }
      .pedal {
        width: 100%;
        height: 100%;
        transform-origin: bottom;
        transform: scaleY(0);
      }
      .pedal.throttle {
        background: #3ddc6a;
      }
      .pedal.brake {
        background: #ff3b3b;
      }
      .readout {
        display: grid;
        grid-template-columns: auto auto;
        grid-template-rows: auto auto;
        align-items: end;
        column-gap: 14px;
        min-width: 170px;
      }
      .gear {
        grid-row: span 2;
        font-size: 64px;
        font-weight: 800;
        line-height: 0.9;
        color: #ffffff;
        font-variant-numeric: tabular-nums;
      }
      .speed {
        font-size: 40px;
        font-weight: 700;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .unit {
        font-size: 12px;
        letter-spacing: 0.12em;
        color: #9aa3ad;
        text-align: right;
      }
      .badges {
        display: grid;
        grid-template-columns: auto auto;
        gap: 6px;
      }
      .badge {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        padding: 3px 7px;
        border-radius: 5px;
        background: #262a31;
        color: #6b7480;
        text-align: center;
      }
      .badge.on {
        color: #e8ecf1;
      }
      .badge.acting {
        background: #f2a531;
        color: #111;
      }
      .badge.drs.on {
        background: #3ddc6a;
        color: #111;
      }
      .badge.mode {
        color: #e8ecf1;
      }
      .g-meter {
        left: 22px;
        bottom: 22px;
        width: 110px;
        height: 110px;
        border-radius: 50%;
      }
      .g-ring {
        position: absolute;
        inset: 8px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 50%;
      }
      .g-ring.inner {
        inset: 32px;
      }
      .g-dot {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 12px;
        height: 12px;
        margin: -6px 0 0 -6px;
        border-radius: 50%;
        background: #f2a531;
        box-shadow: 0 0 8px #f2a531;
      }
      .g-value {
        position: absolute;
        left: 0;
        right: 0;
        bottom: -22px;
        text-align: center;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        color: #c9d0d8;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      }
      .laps {
        right: 22px;
        top: 22px;
        padding: 12px 16px;
        min-width: 170px;
        font-variant-numeric: tabular-nums;
      }
      .lap-now {
        font-size: 30px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .lap-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 14px;
      }
      .lap-label {
        font-size: 11px;
        letter-spacing: 0.12em;
        color: #9aa3ad;
      }
      .lap-time.best {
        color: #c58cff;
      }
      .minimap {
        position: absolute;
        left: 22px;
        top: 22px;
        width: 220px;
        height: 220px;
        border-radius: 14px;
        background: rgba(12, 15, 20, 0.62);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(6px);
      }
      /* under the minimap, where the map's data is shown, its source's credit */
      .map-credit {
        position: absolute;
        left: 22px;
        top: 248px;
        width: 220px;
        font-size: 10px;
        text-align: center;
        color: rgba(255, 255, 255, 0.55);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }
      .map-credit a {
        color: inherit;
        text-decoration: none;
      }
      .menu-hint {
        position: absolute;
        left: 50%;
        bottom: 10px;
        transform: translateX(-50%);
        font-size: 11px;
        letter-spacing: 0.04em;
        color: rgba(255, 255, 255, 0.5);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        pointer-events: none;
      }
      /* everything that isn't the race: the choice, the room, the keys, the credits */
      .menu {
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(600px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
        box-sizing: border-box;
        padding: 22px 24px 20px;
        background: rgba(12, 15, 20, 0.82);
        font-size: 14px;
        color: #d9dee4;
        user-select: auto;
      }
      .menu[hidden],
      .menu-hint[hidden] {
        display: none;
      }
      .menu-title {
        font-size: 18px;
        font-weight: 700;
        color: #f2f4f7;
      }
      .menu-title a {
        color: #6fb0f2;
        text-decoration: none;
      }
      .menu-status {
        margin: 6px 0 16px;
        font-size: 13px;
        color: #aab4bf;
      }
      .menu-row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .menu-row:empty {
        display: none;
      }
      .menu button {
        flex: 1;
        padding: 9px 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.07);
        color: inherit;
        font: inherit;
        white-space: nowrap;
        cursor: pointer;
      }
      .menu button:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.14);
      }
      .menu button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .menu button.first {
        background: #1f6fd1;
        border-color: #1f6fd1;
        color: #ffffff;
      }
      .menu button.first:hover:not(:disabled) {
        background: #2a7be0;
      }
      .menu-code {
        flex: 1.2;
        min-width: 0;
        padding: 9px 12px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 9px;
        background: rgba(0, 0, 0, 0.3);
        color: #ffffff;
        font: inherit;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .menu-code::placeholder {
        letter-spacing: normal;
        text-transform: none;
        color: #7d8793;
      }
      .menu-note {
        min-height: 1.3em;
        margin-top: 10px;
        font-size: 13px;
        color: #aab4bf;
      }
      .menu-note:empty {
        display: none;
      }
      .menu-note.error {
        color: #ff8a80;
      }
      .menu-heading {
        margin: 18px 0 8px;
        padding-top: 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #8d97a3;
      }
      .menu-keys {
        display: grid;
        grid-template-columns: auto 1fr auto 1fr;
        gap: 7px 12px;
        align-items: center;
        font-size: 13px;
      }
      /* on a narrow screen, one pair of columns */
      @media (max-width: 560px) {
        .menu-keys {
          grid-template-columns: auto 1fr;
        }
      }
      .menu-keys kbd {
        display: inline-block;
        min-width: 18px;
        margin-right: 4px;
        padding: 1px 6px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 5px;
        font: inherit;
        font-size: 12px;
        text-align: center;
        color: #f2f4f7;
      }
      .menu-small {
        margin-top: 8px;
        font-size: 12px;
        line-height: 1.55;
        color: #9aa4af;
      }
      .menu-small a {
        color: #6fb0f2;
      }
    </style>
  </head>
  <body>
    <div class="map-credit">© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
